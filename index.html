<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduCoin — Koordinatorlar paneli</title>
<meta name="description" content="EduCoin: maktab koordinatorlari uchun panel. Vazifa va loyihalar uchun EduCoin yig‘ish, maslahatchi tomonidan tanga berish va yo‘nalishlar reytingi.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="EduCoin — Koordinatorlar paneli">
<meta property="og:description" content="Maktab koordinatorlari uchun vazifalar, loyihalar va EduCoin reytingi.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#12161c;--mute:#66707e;--line:#e2e6eb;--side:#12161c;--sink:#aab3c0;--acc:#0f9d8a;--aink:#fff;--ok:#0f9d6a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f13;--card:#161b22;--ink:#eef1f5;--mute:#8d97a6;--line:#242b35;--side:#07090c;--acc:#2dd4bf;--aink:#04201c;--ok:#34d399;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0f13;--card:#161b22;--ink:#eef1f5;--mute:#8d97a6;--line:#242b35;--side:#07090c;--acc:#2dd4bf;--aink:#04201c;--ok:#34d399;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.brand b,.n{font-family:Sora,Inter,sans-serif}
h1,h2,h3{margin:0}h3{font-size:15px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
small{color:var(--mute)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.coin{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--aink);display:grid;place-items:center;font-family:Sora;font-weight:700;flex:none}
.brand{display:flex;gap:10px;align-items:center}.brand small{display:block;color:var(--sink);font-size:12px}
/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:var(--side);color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.1;margin:0 0 14px}.hero p{color:var(--sink);max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips span{border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 18%,transparent);padding:5px 12px;border-radius:99px;font-size:13px}
.fm{display:grid;place-items:center;padding:24px}
.fm form{width:100%;max-width:400px}.fm h2{font-size:26px;margin-bottom:8px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.b{background:var(--acc);color:var(--aink);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
.er{color:#d6402f;min-height:20px;margin:8px 0 0;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:13px;border-left:4px solid var(--c)}
.inbox{background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:10px;margin:10px 0}
.inbox b{font-family:Sora;font-size:22px;letter-spacing:3px}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.side .brand{color:#fff;padding:0 8px}
.side nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nv{display:flex;gap:10px;align-items:center;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;width:100%}
.nv:hover{background:rgba(255,255,255,.06)}.nv.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid rgba(255,255,255,.1);color:#fff}
.me b{font-family:Inter;font-size:14px}.me small{display:block;color:var(--sink);font-size:12px}.me div:nth-child(2){flex:1;min-width:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.me button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:4px 8px;cursor:pointer}
main{padding:28px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:20px}.ph h1{font-size:24px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}.kpi .c{margin:0}
.n{font-size:30px;font-weight:700;line-height:1.1}.ic{font-size:22px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.two .c{margin:0}.two{margin-bottom:14px}
.rw{display:grid;grid-template-columns:48px 1fr 44px;gap:10px;align-items:center;margin:9px 0}.rw b{text-align:right}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.ln:last-child{border:0}
.pos{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid .c{margin:0}
.dc{border-top:4px solid var(--c)}.dc .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 16%,transparent);margin-bottom:10px}
.dc h3{margin:0 0 2px}.dc p{margin:0 0 12px;color:var(--mute);font-size:13px}
.tag{display:inline-block;background:var(--acc);color:var(--aink);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
@media(max-width:820px){
 .auth,.shell,.two{grid-template-columns:1fr}.hero{padding:28px}
 .side{position:static;height:auto;gap:10px}.side nav{flex-direction:row;overflow-x:auto;flex:none}.nv{width:auto;white-space:nowrap}.nv.on{box-shadow:inset 0 -3px 0 var(--acc)}
 main{padding:16px}}
.tabs{display:flex;gap:6px;margin:10px 0 4px}.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--acc);color:var(--aink);border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:9}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pt{font-family:Sora;font-weight:700;font-size:20px;color:var(--acc)}
.bd{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIR=[["Kelajak lideri","🚀","#7c3aed"],["Taʼlim koordinatori","📚","#2563eb"],["Madaniyat koordinatori","🎭","#db2777"],["IT va sunʼiy intellekt","🤖","#0891b2"],["Sport koordinatori","⚽","#ea580c"],["Ekologiya koordinatori","🌿","#16a34a"],["Media koordinatori","🎬","#ca8a04"],["Ijtimoiy tashabbus","🤝","#dc2626"]];
const NAMES=[["Xamraqulova Gulsanam","gulsanam"],["Abdugʻaffarova Shabnam","shabnam"],["Sobirova Sabina","sabina"],["Normamatov Nurbek","nurbek"],["Bazarbayev Otabek","otabek"],["Xoljurayeva Pokiza","pokiza"],["Yakubova Aliya","aliya"],["Xoljigitova Bahor","bahor"]];
const ADV_CODE="0150";
const seed=()=>({users:[{id:1,role:"advisor",name:"Maktab maslahatchisi",email:"maslahatchi@educoin.uz"}],projects:[],awards:[],tasks:[]});
const seedTasks=()=>[];
let db;try{db=JSON.parse(localStorage.getItem("educoin_coord3")||"null")}catch(e){}
if(!db)db=seed();
if(!db.tasks)db.tasks=seedTasks();
const save=()=>{try{localStorage.setItem("educoin_coord3",JSON.stringify(db))}catch(e){}};
const sum=a=>a.reduce((x,y)=>x+y,0),today=()=>new Date().toISOString().slice(0,10),fmt=d=>d.split("-").reverse().join(".");
const dpts=d=>sum(db.awards.filter(a=>a.dir===d).map(a=>a.pts)),ppts=id=>sum(db.awards.filter(a=>a.pid===id).map(a=>a.pts));
const cnames=d=>db.users.filter(u=>u.role==="coord"&&u.dir===d).map(u=>u.name).join(", ")||"Hali tayinlanmagan",dinfo=d=>DIR.find(x=>x[0]===d)||DIR[0];
let me=null,tab="rank";
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function auth(){
 $("#app").innerHTML=`<div class="auth"><section class="hero"><div class="brand"><span class="coin">E</span><b>EduCoin</b></div><div><h1>Koordinatorlar paneli</h1><p>Vazifalar va loyihalar uchun EduCoin yigʻing. Tangani maktab maslahatchisi beradi, har bir koordinator faqat oʻz yoʻnalishini koʻradi.</p><div class="chips">${DIR.map(d=>`<span style="--c:${d[2]}">${d[1]} ${d[0]}</span>`).join("")}</div></div><small>© 2026 EduCoin</small></section>
 <section class="fm"><form id="f" novalidate><h2>Kirish</h2><div class="tabs"><button type="button" id="m1" class="on">Kirish</button><button type="button" id="m2">Roʻyxatdan oʻtish</button><button type="button" id="m3">Maslahatchi</button></div><div id="st"></div></form></section></div>`;
 const st=$("#st");let mode="in",step=1,pend=null,email="",code="";
 const D=()=>db.draft||(db.draft={});
 const keep=()=>{["dr","fn","ln","em"].forEach(k=>{const el=$("#"+k);if(el)D()[k]=el.value});save()};
 st.addEventListener("input",keep);st.addEventListener("change",keep);
 const B=t=>`<p class="er" id="er" role="alert"></p><button class="b">${t}</button>`,err=m=>$("#er").textContent=m;
 const fIn=()=>{step=1;st.innerHTML=`<label for="em">Elektron pochta</label><input id="em" type="email" autocomplete="email" placeholder="pochtangiz@gmail.com" value="${esc(D().em||"")}">${B("Kod olish")}`};
 const fUp=()=>{step=1;st.innerHTML=`<label for="dr">Lavozimingiz</label><select id="dr">${DIR.map(d=>`<option ${D().dr===d[0]?"selected":""}>${esc(d[0])}</option>`).join("")}</select><div class="row2"><div><label for="fn">Ism</label><input id="fn" value="${esc(D().fn||"")}"></div><div><label for="ln">Familiya</label><input id="ln" value="${esc(D().ln||"")}"></div></div><label for="em">Elektron pochta</label><input id="em" type="email" autocomplete="email" placeholder="pochtangiz@gmail.com" value="${esc(D().em||"")}">${B("Kod olish")}<small>Yozganlaringiz avtomatik saqlanadi.</small>`};
 const fAdv=()=>{step=1;st.innerHTML=`<label for="ac">Maslahatchi kirish kodi</label><input id="ac" type="password" inputmode="numeric">${B("Kirish")}`};
 const fCode=()=>{step=2;st.innerHTML=`<p>Tasdiqlash kodingiz tayyor. U quyida koʻrsatilgan va avtomatik yozilgan.</p><div class="inbox"><small>🔑 Sizning kodingiz:</small><br><b>${code}</b></div><label for="cd">Kod</label><input id="cd" inputmode="numeric" maxlength="6" value="${code}">${B("Kirish")}<button type="button" class="b" id="bk" style="background:none;color:var(--ink);border:1px solid var(--line)">Orqaga</button>`;$("#bk").onclick=()=>begin()};
 const begin=()=>{mode==="adv"?fAdv():mode==="up"?fUp():fIn()};
 const setM=m=>{mode=m;["in","up","adv"].forEach((x,i)=>$("#m"+(i+1)).className=x===m?"on":"");begin()};
 $("#m1").onclick=()=>setM("in");$("#m2").onclick=()=>setM("up");$("#m3").onclick=()=>setM("adv");
 const enter=u=>{me=u;db.session=u.id;db.draft=null;save();tab=u.role==="advisor"?"rank":"home";shell()};
 $("#f").onsubmit=e=>{e.preventDefault();
  if(mode==="adv"){if($("#ac").value.trim()!==ADV_CODE){err("Kod notoʻgʻri.");return}enter(db.users.find(x=>x.role==="advisor"));return}
  if(step===1){
   email=$("#em").value.trim().toLowerCase();
   if(mode==="up"){const fn=$("#fn").value.trim(),ln=$("#ln").value.trim();
    if(fn.length<2){err("Ismingizni yozing.");return}
    if(ln.length<2){err("Familiyangizni yozing.");return}}
   if(!emailOk(email)){err("Pochtani toʻliq yozing, masalan: ali@gmail.com");return}
   const u=db.users.find(x=>x.email===email);
   if(mode==="in"){if(!(u&&u.role==="coord")){err("Bu pochta bilan koordinator topilmadi. Avval \"Roʻyxatdan oʻtish\" boʻlimidan oʻting.");return}pend=u}
   else{if(u){err("Bu pochta allaqachon roʻyxatdan oʻtgan. \"Kirish\" boʻlimidan kiring.");return}
    pend={id:Math.max(...db.users.map(x=>x.id))+1,role:"coord",email,name:$("#fn").value.trim()+" "+$("#ln").value.trim(),dir:$("#dr").value}}
   code=String(Math.floor(100000+Math.random()*900000));fCode();return}
  if($("#cd").value.trim()!==code){err("Kod notoʻgʻri. Qayta urinib koʻring.");return}
  if(!db.users.some(x=>x.id===pend.id))db.users.push(pend);
  enter(pend)};
 begin();
}

function shell(t){
 if(t)tab=t;
 const adv=me.role==="advisor",c=adv?"#0f9d8a":dinfo(me.dir)[2],ini=me.name.split(" ").map(w=>w[0]).slice(0,2).join("");
 const NAV=adv?[["rank","🏆","Reyting"],["tasks","📋","Vazifalar"],["give","🪙","Tanga berish"],["dirs","🧭","Yoʻnalishlar"],["log","🧾","Tarix"]]:[["home","🏠","Yoʻnalishim"],["tasks","📋","Vazifalarim"],["log","🧾","Tanga tarixi"]];
 $("#app").innerHTML=`<div class="shell" style="--acc:${c}"><aside class="side"><div class="brand"><span class="coin">E</span><div><b>EduCoin</b><small>${adv?"Maslahatchi paneli":"Koordinator paneli"}</small></div></div>
 <nav aria-label="Boʻlimlar">${NAV.map(n=>`<button class="nv ${tab===n[0]?"on":""}" data-t="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav>
 <div class="me"><div class="av" style="background:${c}">${esc(ini)}</div><div><b>${esc(me.name)}</b><small>${esc(adv?"Maktab maslahatchisi":me.dir)}</small></div><button id="lo">Chiqish</button></div></aside><main id="main"></main></div>`;
 $("#lo").onclick=()=>{me=null;db.session=null;save();auth()};
 document.querySelectorAll(".nv").forEach(b=>b.onclick=()=>shell(b.dataset.t));
 (adv?{rank:rankP,tasks:advTasks,give:giveP,dirs:dirsP,log:()=>logP(null)}:{home:coHome,tasks:coTasks,log:()=>logP(me.dir)})[tab]();
}
const page=(t,h)=>$("#main").innerHTML=`<div class="ph"><h1>${t}</h1><small>${fmt(today())}</small></div>`+h;
const kpi=a=>`<div class="kpi">${a.map(k=>`<div class="c"><div class="ic">${k[0]}</div><div class="n">${k[1]}</div><small>${k[2]}</small></div>`).join("")}</div>`;

function rankP(){
 const L=DIR.map(d=>[d,dpts(d[0])]).sort((a,b)=>b[1]-a[1]),mx=Math.max(...L.map(l=>l[1]),1);
 page("Yoʻnalishlar reytingi",kpi([["📁",db.projects.length,"loyiha"],["🪙",sum(L.map(l=>l[1])),"jami EduCoin"],["🧑‍💼",db.users.filter(u=>u.role==="coord").length,"koordinator"]])+`<div class="c">${L.map((l,i)=>{const d=l[0];return`<div class="rw" style="grid-template-columns:26px 1.4fr 1.6fr 44px"><b>${i+1}</b><span>${d[1]} ${esc(d[0])}<br><small>${esc(cnames(d[0]))}</small></span><div class="bar"><i style="width:${l[1]/mx*100}%;background:${d[2]}"></i></div><b>${l[1]}</b></div>`}).join("")}</div>`);
}
function giveP(){
 page("Tanga berish",`<div class="c" style="max-width:560px"><label for="gd">Yoʻnalish</label><select id="gd">${DIR.map(d=>`<option>${esc(d[0])}</option>`).join("")}</select><label for="gp">Loyiha</label><select id="gp"></select><div class="row2"><div><label for="ga">EduCoin</label><input id="ga" type="number" min="1" value="10"></div><div><label for="gr">Sabab</label><input id="gr" placeholder="Ixtiyoriy"></div></div><p class="er" id="er"></p><div class="row2"><button class="b" id="gpl" style="margin:0">Tanga qoʻshish</button><button class="b" id="gm" style="margin:0;background:#d6402f;color:#fff">Tanga ayirish</button></div></div>`);
 const fill=()=>{$("#gp").innerHTML=db.projects.filter(p=>p.dir===$("#gd").value).map(p=>`<option value="${p.id}">${esc(p.title)} (${ppts(p.id)})</option>`).join("")||"<option value=''>Loyiha yoʻq</option>"};
 $("#gd").onchange=fill;fill();
 const go=s=>{const pid=+$("#gp").value,n=Math.abs(parseInt($("#ga").value)||0);if(!pid||!n){$("#er").textContent="Loyiha va miqdorni tanlang.";return}
  db.awards.push({id:Math.max(0,...db.awards.map(a=>a.id))+1,pid,dir:$("#gd").value,pts:s*n,reason:$("#gr").value.trim()||(s>0?"Loyiha uchun mukofot":"Ayirma"),date:today()});save();toast(`${s>0?"+":"−"}${n} EduCoin berildi`);giveP()};
 $("#gpl").onclick=()=>go(1);$("#gm").onclick=()=>go(-1);
}
function dirsP(){
 page("Yoʻnalishlar va koordinatorlar",`<p><small>Koordinatorlar oʻzlari roʻyxatdan oʻtadi, har biri faqat oʻz yoʻnalishini koʻradi. Notoʻgʻri roʻyxatdan oʻtganni shu yerdan oʻchirishingiz mumkin.</small></p><div class="grid">${DIR.map(d=>{const L=db.users.filter(u=>u.role==="coord"&&u.dir===d[0]);return`<div class="c dc" style="--c:${d[2]}"><div class="ib">${d[1]}</div><h3>${esc(d[0])}</h3><p><span class="pt">${dpts(d[0])}</span> EduCoin · ${db.projects.filter(p=>p.dir===d[0]).length} loyiha</p>${L.map(u=>`<div class="ln" style="align-items:center"><span><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></span><button class="b" data-rm="${u.id}" style="margin:0;width:auto;padding:5px 10px;background:#d6402f;color:#fff">Oʻchirish</button></div>`).join("")||"<small>Hali koordinator yoʻq</small>"}</div>`}).join("")}</div>`);
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{if(!confirm("Bu koordinator oʻchirilsinmi?"))return;db.users=db.users.filter(u=>u.id!==+b.dataset.rm);save();toast("Oʻchirildi");dirsP()});
}
function logP(d){
 const L=db.awards.filter(a=>!d||a.dir===d).slice().sort((a,b)=>a.date<b.date?1:a.id<b.id?1:-1);
 page(d?"Tanga tarixi":"Barcha tangalar tarixi",`<div class="c">${L.map(a=>{const p=db.projects.find(x=>x.id===a.pid)||{title:"Vazifa"},di=dinfo(a.dir);return`<div class="ln"><span><b>${esc(p.title)}</b> ${d?"":`<span class="bd" style="--c:${di[2]}">${di[1]} ${esc(a.dir)}</span>`}<br><small>${fmt(a.date)} · ${esc(a.reason)}</small></span><b class="pt" style="${a.pts<0?"color:#d6402f":""}">${a.pts>0?"+":""}${a.pts}</b></div>`}).join("")||"<small>Hali tanga berilmagan</small>"}</div>`);
}
function coHome(){
 const d=dinfo(me.dir),P=db.projects.filter(p=>p.dir===me.dir);
 page(d[1]+" "+esc(d[0]),kpi([["🪙",dpts(me.dir),"EduCoin balansi"],["✅",db.tasks.filter(t=>t.dir===me.dir&&t.status==="done").length,"bajarilgan vazifa"],["📁",P.length,"loyiha"]])+`<div class="two"><div class="c"><h3>Loyihalarim</h3>${P.map(p=>`<div class="ln"><span><b>${esc(p.title)}</b><br><small>${esc(p.desc)}</small></span><b class="pt">${ppts(p.id)}</b></div>`).join("")||"<small>Hali loyiha yoʻq</small>"}</div>
 <div class="c"><h3>Yangi loyiha qoʻshish</h3><label for="pt">Nomi</label><input id="pt"><label for="pd">Qisqacha tavsif</label><input id="pd"><p class="er" id="er"></p><button class="b" id="pa" style="margin-top:0">Qoʻshish</button><p><small>Loyiha uchun tangani maktab maslahatchisi beradi.</small></p></div></div>`);
 $("#pa").onclick=()=>{const t=$("#pt").value.trim();if(!t){$("#er").textContent="Loyiha nomini yozing.";return}
  db.projects.push({id:Math.max(0,...db.projects.map(p=>p.id))+1,dir:me.dir,title:t,desc:$("#pd").value.trim()});save();toast("Loyiha qoʻshildi");coHome()};
}
const left=d=>Math.ceil((new Date(d)-new Date(today()))/864e5),nid=a=>Math.max(0,...a.map(x=>x.id))+1;
function coTasks(){
 const T=db.tasks.filter(t=>t.dir===me.dir);
 page("Vazifalarim",`<div class="c">${T.map(t=>{const l=left(t.deadline);return`<div class="ln" style="align-items:center"><span><b>${esc(t.title)}</b><br><small>Muddat: ${fmt(t.deadline)} (${l>=0?l+" kun qoldi":"muddat oʻtgan"})</small></span><span style="display:flex;gap:10px;align-items:center"><span class="tag">+${t.coins}</span>${t.status==="done"?'<b style="color:var(--ok)">Qabul qilindi</b>':t.status==="pending"?"<small>Tekshirilmoqda</small>":`<button class="b" data-tk="${t.id}" style="margin:0;width:auto;padding:7px 14px">Bajardim</button>`}</span></div>`}).join("")||"<small>Vazifa yoʻq</small>"}</div>`);
 document.querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>{db.tasks.find(t=>t.id===+b.dataset.tk).status="pending";save();toast("Maslahatchiga yuborildi");coTasks()});
}
function advTasks(){
 const P=db.tasks.filter(t=>t.status==="pending"),A=db.tasks.filter(t=>t.status!=="pending");
 page("Vazifalar",`<div class="c"><h3>Tekshirish kutilmoqda</h3>${P.map(t=>`<div class="ln" style="align-items:center"><span><b>${esc(t.title)}</b> <span class="bd" style="--c:${dinfo(t.dir)[2]}">${dinfo(t.dir)[1]} ${esc(t.dir)}</span><br><small>${esc(cnames(t.dir))}</small></span><button class="b" data-ok="${t.id}" style="margin:0;width:auto;padding:7px 14px">Tasdiqlash +${t.coins}</button></div>`).join("")||"<small>Hozircha hech narsa yoʻq</small>"}</div>
 <div class="two"><div class="c"><h3>Yangi vazifa</h3><label for="vd">Kimga</label><select id="vd"><option value="*">Barcha yoʻnalishlar</option>${DIR.map(d=>`<option>${esc(d[0])}</option>`).join("")}</select><label for="vt">Vazifa</label><input id="vt"><div class="row2"><div><label for="vc">EduCoin</label><input id="vc" type="number" min="1" value="60"></div><div><label for="vm">Muddat</label><input id="vm" type="date" value="${today()}"></div></div><p class="er" id="er"></p><button class="b" id="va" style="margin-top:0">Vazifa qoʻshish</button></div>
 <div class="c"><h3>Barcha vazifalar</h3>${A.map(t=>`<div class="ln"><span>${esc(t.title)}<br><small>${dinfo(t.dir)[1]} ${esc(t.dir)} · ${fmt(t.deadline)}</small></span><span class="tag">${t.status==="done"?"✓ ":"+"}${t.coins}</span></div>`).join("")}</div></div>`);
 document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const t=db.tasks.find(x=>x.id===+b.dataset.ok);t.status="done";db.awards.push({id:nid(db.awards),pid:null,dir:t.dir,pts:t.coins,reason:"Vazifa: "+t.title,date:today()});save();toast("Tasdiqlandi: +"+t.coins+" EduCoin");advTasks()});
 $("#va").onclick=()=>{const t=$("#vt").value.trim(),c=parseInt($("#vc").value)||0;if(!t||!c){$("#er").textContent="Vazifa va EduCoin miqdorini kiriting.";return}
  (($("#vd").value==="*")?DIR.map(d=>d[0]):[$("#vd").value]).forEach(d=>db.tasks.push({id:nid(db.tasks),dir:d,title:t,coins:c,deadline:$("#vm").value||today(),status:"open"}));save();toast("Vazifa qoʻshildi");advTasks()};
}
{const u=db.users.find(x=>x.id===db.session);if(u){me=u;tab=u.role==="advisor"?"rank":"home";shell()}else auth()}
</script>
